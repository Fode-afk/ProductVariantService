syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package product.v1;

option csharp_namespace = "ProductService.Api.Grpc.V1.Protos";

service ProductService {
	rpc CreateProduct(CreateProductRequest) returns (google.protobuf.Empty);
    rpc UpdateProductInfo(UpdateProductInfoRequest) returns (google.protobuf.Empty);

    rpc MarkProductAsDefault(MarkProductAsDefaultRequest) returns (google.protobuf.Empty);
    rpc UnmarkProductAsDefault(UnmarkProductAsDefaultRequest) returns (google.protobuf.Empty);

    rpc ReplaceProductAttributes(ReplaceProductAttributesRequest) returns (google.protobuf.Empty);
    rpc ReplaceProductTags(ReplaceProductTagsRequest) returns (google.protobuf.Empty);

    rpc AddProductImage(AddProductImageRequest) returns (google.protobuf.Empty);
    rpc RemoveProductImage(RemoveProductImageRequest) returns (google.protobuf.Empty);
    rpc ChangeProductImageOrder(ChangeProductImageOrderRequest) returns (google.protobuf.Empty);
    rpc SetMainProductImage(SetMainProductImageRequest) returns (google.protobuf.Empty);
    rpc UpdateProductImageAlt(UpdateProductImageAltRequest) returns (google.protobuf.Empty);

    rpc GetProductsByCardId(GetProductsByCardIdRequest) returns (GetProductsByCardIdResponse);
}

message ProductDto {
    string id = 1; 
    string sku = 2;
    string name = 3;
    string barcode = 4;
    DimensionsDto dimensions = 5;
    WeightDto weight = 6;
    map<string, string> attributes = 7;
    repeated string tags = 8;
    repeated ProductImageDto images = 9;
}

message DimensionsDto {
    double length = 1;
    double width = 2;
    double height = 3;
    string unit = 4;
}

message WeightDto {
    double value = 1;
    string unit = 2;
}

message ProductImageDto {
    string url = 1;
    string alt = 2;
    bool is_main = 3;
    int32 sort_order = 4;
}

message CreateProductRequest {
    string vendor_id = 1;
    string product_card_id = 2;
    string name = 3;

    DimensionsDto dimensions = 4;
    WeightDto weight = 5;

    string barcode = 6;
    string sku = 7;

    map<string, string> attributes = 8;
    repeated string tags = 9;

    bool is_default = 10;
}

message UpdateProductInfoRequest {
    string vendor_id = 1;
    string product_id = 2;
    string name = 3;
    DimensionsDto dimensions = 4;
    WeightDto weight = 5;
}

message MarkProductAsDefaultRequest {
    string vendor_id = 1;
    string product_id = 2;
}

message UnmarkProductAsDefaultRequest {
    string vendor_id = 1;
    string product_id = 2;
}

message ReplaceProductAttributesRequest {
    string vendor_id = 1;
    string product_id = 2;
    map<string, string> attributes = 3;
}

message ReplaceProductTagsRequest {
    string vendor_id = 1;
    string product_id = 2;
    repeated string tags = 3;
}

message AddProductImageRequest {
    string vendor_id = 1;
    string product_id = 2;
    string url = 3;
    string alt = 4;
    bool is_main = 5;
    int32 sort_order = 6;
}

message RemoveProductImageRequest {
    string vendor_id = 1;
    string product_id = 2;
    string url = 3;
}

message ChangeProductImageOrderRequest {
    string vendor_id = 1;
    string product_id = 2;
    string url = 3;
    int32 new_sort_order = 4;
}

message SetMainProductImageRequest {
    string vendor_id = 1;
    string product_id = 2;
    string url = 3;
}

message UpdateProductImageAltRequest {
    string vendor_id = 1;
    string product_id = 2;
    string url = 3;
    string new_alt = 4;
}

message GetProductsByCardIdRequest {
    string product_card_id = 1;
}

message GetProductsByCardIdResponse {
    repeated ProductDto products = 1;
}