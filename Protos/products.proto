syntax = "proto3";

option csharp_namespace = "ProductService.Protos";

service GrpcProducts
{
    rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
    rpc GetAllProductsByOwnerId(GetAllProductsByOwnerIdRequest) returns (GetAllProductsByOwnerIdResponse);
    rpc GetProductById(GetProductRequest) returns (GetProductResponse);
    rpc ReplaceProductById(ReplaceProductRequest) returns (ReplaceProductResponse);
    rpc UpdateProductById(UpdateProductRequest) returns (UpdateProductResponse);
    rpc DeleteProductById(DeleteProductRequest) returns (DeleteProductResponse);
    rpc ProductExists(ProductExistsRequest) returns (ProductExistsResponse);
}

message ProductGrpc
{
    string productId = 1;   
    string ownerId = 2;
    string name = 3;
    string description = 4;    
    int32 price = 5;  
    string createdAt = 6;
    string updatedAt = 7;
    repeated string imageURLs = 8;
    repeated ProductAttributeGrpc attributes = 9;
}

message ProductAttributeGrpc
{ 
    string name = 1; 
    string value = 2;
}

message CreateProductRequest
{    
    string ownerId = 1;   
    string name = 2;
}

message CreateProductResponse
{  
    bool status = 1;
}

message GetAllProductsByOwnerIdRequest
{
    string ownerId = 1;
}

message GetAllProductsByOwnerIdResponse
{  
    bool status = 1;  
    repeated ProductGrpc products = 2;
}

message GetProductRequest
{
    string productId = 1;
}

message GetProductResponse
{
    bool status = 1;
    ProductGrpc product = 2;
}

message DeleteProductRequest
{
    string productId = 1;
}

message DeleteProductResponse
{
    bool status = 1;
}

message ReplaceProductRequest
{
    string productId = 1;   
    string name = 2;
    string description = 3;    
    int32 price = 4;  
    repeated string imageURLs = 5;
    repeated ProductAttributeGrpc attributes = 6;
}

message ReplaceProductResponse
{
    bool status = 1;
}

message UpdateProductRequest
{
    string productId = 1;   
    string name = 2;
    string description = 3;    
    int32 price = 4;  
    repeated string imageURLs = 5;
    repeated ProductAttributeGrpc attributes = 6;
}

message UpdateProductResponse
{
    bool status = 1;
}

message ProductExistsRequest
{
    string productId = 1;
}
message ProductExistsResponse
{
    bool status = 1;
}